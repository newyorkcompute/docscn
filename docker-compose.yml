# Local development only. Do not expose Postgres or MinIO ports on untrusted networks.
version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: docscn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: docscn
      POSTGRES_PASSWORD: docscn
      POSTGRES_DB: docscn
    ports:
      - '5433:5432'
    volumes:
      - docscn_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U docscn -d docscn']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    container_name: docscn-minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: docscn
      MINIO_ROOT_PASSWORD: docscn-local-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - docscn_minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-04-08T15-39-49Z
    container_name: docscn-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 docscn docscn-local-secret; do sleep 1; done &&
      mc mb --ignore-existing local/docscn-artifacts
      "

volumes:
  docscn_postgres_data:
  docscn_minio_data:
