name: Setup Node and Nx
description: Checkout, set Nx SHAs, install dependencies, and restore the Nx task cache

inputs:
  node-version:
    description: Node.js version
    required: false
    default: '20'

runs:
  using: composite
  steps:
    - name: Check out repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set Nx base and head SHAs
      uses: nrwl/nx-set-shas@v4

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    - name: Install dependencies
      run: npm ci
      shell: bash

    - name: Restore Nx task cache
      uses: actions/cache@v4
      with:
        path: .nx/cache
        key: nx-${{ runner.os }}-${{ hashFiles('package-lock.json', 'nx.json', '**/project.json') }}
        restore-keys: |
          nx-${{ runner.os }}-
