name: Release CLI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test-cli:
    name: Test CLI
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test CLI
        run: npm run test:cli

  build-assets:
    name: Build ${{ matrix.name }} binaries
    needs: test-cli
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            targets: docscn-darwin-arm64,docscn-darwin-x64
          - name: Linux
            os: ubuntu-latest
            targets: docscn-linux-arm64,docscn-linux-x64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build release binaries
        env:
          DOCSCN_RELEASE_TARGETS: ${{ matrix.targets }}
        run: npm run build:cli:release

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: cli-assets-${{ matrix.name }}
          path: dist/releases/docscn-*

  release-cli:
    name: Create GitHub release
    needs: build-assets
    runs-on: ubuntu-latest

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          path: dist/releases
          merge-multiple: true

      - name: Write checksums
        run: |
          cd dist/releases
          sha256sum docscn-* > SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" dist/releases/* \
            --title "$TAG_NAME" \
            --notes "docscn CLI $TAG_NAME" \
            --verify-tag
