name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Check OpenAPI sync
        run: npm run openapi:check

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test CLI
        run: npm run test:cli

      - name: Test MCP
        run: npm run test:mcp

  integration:
    name: Backend API integration
    runs-on: ubuntu-latest
    needs: [static-checks, unit-tests]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare persistent local stack
        run: npm run setup:local

      - name: Start web app
        run: |
          npm run dev:persistent > /tmp/docscn-dev.log 2>&1 &
          echo $! > /tmp/docscn-dev.pid
          for attempt in $(seq 1 60); do
            if curl -sf http://localhost:3000 > /dev/null; then
              echo "Web app ready"
              exit 0
            fi
            sleep 2
          done
          echo "Web app failed to start"
          cat /tmp/docscn-dev.log
          exit 1

      - name: Run backend API tests
        run: npm run test:backend

      - name: Run MCP integration tests
        run: npm run test:mcp:integration

      - name: Stop web app
        if: always()
        run: |
          if [ -f /tmp/docscn-dev.pid ]; then
            kill "$(cat /tmp/docscn-dev.pid)" || true
          fi
