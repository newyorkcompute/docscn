name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    env:
      # `next build` uses NODE_ENV=production; real deploys must set this secret.
      BETTER_AUTH_SECRET: ci-github-actions-build-placeholder-32-chars-min

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up workspace
        uses: ./.github/actions/setup-node-nx

      - name: Lint affected projects
        run: npm run ci:affected:lint -- --base="$NX_BASE" --head="$NX_HEAD"

      - name: Build affected projects
        run: npm run ci:affected:build -- --base="$NX_BASE" --head="$NX_HEAD"

      - name: Check formatting
        run: npx nx format:check --base="$NX_BASE" --head="$NX_HEAD"

      - name: Check OpenAPI sync
        run: npm run openapi:check

      - name: Audit dependencies
        run: npm run audit:ci

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up workspace
        uses: ./.github/actions/setup-node-nx

      - name: Test affected unit targets
        run: npm run ci:affected:unit -- --base="$NX_BASE" --head="$NX_HEAD"

  unit-coverage:
    name: Unit coverage
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up workspace
        uses: ./.github/actions/setup-node-nx

      - name: Generate unit coverage
        run: npm run coverage:unit

      - name: Upload unit coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: coverage/unit/
          if-no-files-found: ignore

      - name: Update PR coverage comment
        if: success()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs');

            const marker = '<!-- docscn-coverage-comment -->';
            const body = fs.readFileSync('coverage/unit/coverage-comment.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existingComment = comments.find((comment) =>
              comment.body?.includes(marker),
            );

            try {
              if (existingComment) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existingComment.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number,
                  body,
                });
              }
            } catch (error) {
              if (error.status === 403) {
                core.warning(`Coverage generated, but the workflow token cannot update PR comments: ${error.message}`);
                return;
              }

              throw error;
            }

  integration-and-e2e:
    name: Integration and E2E
    runs-on: ubuntu-latest
    needs: [static-checks, unit-tests]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up workspace
        uses: ./.github/actions/setup-node-nx

      - name: Prepare persistent local stack
        run: npm run setup:local

      - name: Start web app
        run: |
          npm run dev:persistent > /tmp/docscn-dev.log 2>&1 &
          echo $! > /tmp/docscn-dev.pid
          for attempt in $(seq 1 60); do
            if curl -sf http://localhost:3000 > /dev/null; then
              echo "Web app ready"
              exit 0
            fi
            sleep 2
          done
          echo "Web app failed to start"
          cat /tmp/docscn-dev.log
          exit 1

      - name: Run backend API tests
        run: npm run test:backend

      - name: Run MCP integration tests
        run: npm run test:mcp:integration

      - name: Restore Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Stop web app
        if: always()
        run: |
          if [ -f /tmp/docscn-dev.pid ]; then
            kill "$(cat /tmp/docscn-dev.pid)" || true
          fi
