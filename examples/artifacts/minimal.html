<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>docscn example artifact</title>
    <style>
      :root {
        color-scheme: light;
        font-family: ui-sans-serif, system-ui, sans-serif;
        --bg: #eef4ff;
        --bg-end: #ffffff;
        --fg: #0f172a;
        --muted: #334155;
        --card: rgba(255, 255, 255, 0.88);
        --border: rgba(15, 23, 42, 0.08);
      }

      @media (prefers-color-scheme: dark) {
        :root:not(.light):not(.dark) {
          color-scheme: dark;
          --bg: #0c1220;
          --bg-end: #111827;
          --fg: #e2e8f0;
          --muted: #94a3b8;
          --card: rgba(17, 24, 39, 0.92);
          --border: rgba(148, 163, 184, 0.18);
        }
      }

      html.dark,
      html[data-docscn-theme='dark'] {
        color-scheme: dark;
        --bg: #0c1220;
        --bg-end: #111827;
        --fg: #e2e8f0;
        --muted: #94a3b8;
        --card: rgba(17, 24, 39, 0.92);
        --border: rgba(148, 163, 184, 0.18);
      }

      html.light,
      html[data-docscn-theme='light'] {
        color-scheme: light;
        --bg: #eef4ff;
        --bg-end: #ffffff;
        --fg: #0f172a;
        --muted: #334155;
        --card: rgba(255, 255, 255, 0.88);
        --border: rgba(15, 23, 42, 0.08);
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(180deg, var(--bg), var(--bg-end));
        color: var(--fg);
      }

      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 4rem 1.5rem;
      }

      h1 {
        font-size: 2.5rem;
        line-height: 1.1;
        margin: 0 0 1rem;
      }

      p {
        font-size: 1.05rem;
        line-height: 1.7;
        color: var(--muted);
      }

      .card {
        margin-top: 2rem;
        padding: 1.25rem 1.5rem;
        border-radius: 1rem;
        background: var(--card);
        border: 1px solid var(--border);
      }

      code {
        font-size: 0.9em;
      }
    </style>
    <style data-docscn-template-theme>
      :root {
        --docscn-template-bg: #f8efe7;
        --docscn-template-surface: #fffaf6;
        --docscn-template-surface-strong: #ffffff;
        --docscn-template-ink: #181927;
        --docscn-template-muted: #706977;
        --docscn-template-border: #decfc2;
        --docscn-template-grid: transparent;
        --docscn-template-accent: #b94719;
        --docscn-template-accent-soft: rgba(185, 71, 25, 0.12);
        --docscn-template-accent-strong: #8f3415;
        --docscn-template-accent-fg: #fff7ef;
        --docscn-template-shadow: 0 24px 70px rgba(84, 45, 24, 0.12);
        --docscn-template-radius: 28px;
        --docscn-template-radius-sm: 14px;

        --bg: var(--docscn-template-bg);
        --fg: var(--docscn-template-ink);
        --ink: var(--docscn-template-ink);
        --slate: var(--docscn-template-ink);
        --ivory: var(--docscn-template-bg);
        --paper: var(--docscn-template-surface);
        --white: var(--docscn-template-surface-strong);
        --card: var(--docscn-template-surface);
        --card-bg: linear-gradient(
          135deg,
          var(--docscn-template-surface-strong),
          var(--docscn-template-surface)
        );
        --card-border: var(--docscn-template-border);
        --event-border: var(--docscn-template-border);
        --line: var(--docscn-template-border);
        --border: var(--docscn-template-border);
        --oat: var(--docscn-template-border);
        --muted: var(--docscn-template-muted);
        --gray-150: #f3e9df;
        --gray-200: #eadccd;
        --gray-300: var(--docscn-template-border);
        --gray-500: var(--docscn-template-muted);
        --gray-700: #4f4750;
        --g100: #f3e9df;
        --g200: #eadccd;
        --g300: var(--docscn-template-border);
        --g500: var(--docscn-template-muted);
        --g700: #4f4750;
        --accent: var(--docscn-template-accent);
        --accent-fg: var(--docscn-template-accent-fg);
        --clay: var(--docscn-template-accent);
        --clay-d: var(--docscn-template-accent-strong);
        --rust: var(--docscn-template-accent-strong);
        --olive: #8a6f3d;
        --good: #1f7a62;
        --warn: #bd7a1f;
        --sev-border: #d95f37;
        --sev-fg: var(--docscn-template-accent-strong);
        --pre-bg: #f4e9df;
        --code: #f4e9df;
        --code-bg: #f4e9df;
      }

      @media (prefers-color-scheme: dark) {
        :root:not(.light):not(.dark) {
          --docscn-template-bg: #151722;
          --docscn-template-surface: #1d202d;
          --docscn-template-surface-strong: #232636;
          --docscn-template-ink: #f7efe8;
          --docscn-template-muted: #b9afb7;
          --docscn-template-border: #38313a;
          --docscn-template-grid: transparent;
          --docscn-template-accent: #f08e55;
          --docscn-template-accent-soft: rgba(240, 142, 85, 0.16);
          --docscn-template-accent-strong: #ffb083;
          --docscn-template-accent-fg: #20140f;
          --docscn-template-shadow: 0 24px 70px rgba(0, 0, 0, 0.34);
          --gray-150: #202330;
          --gray-200: #282a38;
          --gray-700: #d9d0d3;
          --g100: #202330;
          --g200: #282a38;
          --g700: #d9d0d3;
          --pre-bg: #171a24;
          --code: #171a24;
          --code-bg: #171a24;
        }
      }

      html.dark,
      html[data-docscn-theme='dark'] {
        --docscn-template-bg: #151722;
        --docscn-template-surface: #1d202d;
        --docscn-template-surface-strong: #232636;
        --docscn-template-ink: #f7efe8;
        --docscn-template-muted: #b9afb7;
        --docscn-template-border: #38313a;
        --docscn-template-grid: transparent;
        --docscn-template-accent: #f08e55;
        --docscn-template-accent-soft: rgba(240, 142, 85, 0.16);
        --docscn-template-accent-strong: #ffb083;
        --docscn-template-accent-fg: #20140f;
        --docscn-template-shadow: 0 24px 70px rgba(0, 0, 0, 0.34);
        --gray-150: #202330;
        --gray-200: #282a38;
        --gray-700: #d9d0d3;
        --g100: #202330;
        --g200: #282a38;
        --g700: #d9d0d3;
        --pre-bg: #171a24;
        --code: #171a24;
        --code-bg: #171a24;
      }

      html.light,
      html[data-docscn-theme='light'] {
        --docscn-template-bg: #f8efe7;
        --docscn-template-surface: #fffaf6;
        --docscn-template-surface-strong: #ffffff;
        --docscn-template-ink: #181927;
        --docscn-template-muted: #706977;
        --docscn-template-border: #decfc2;
        --docscn-template-grid: transparent;
        --docscn-template-accent: #b94719;
        --docscn-template-accent-soft: rgba(185, 71, 25, 0.12);
        --docscn-template-accent-strong: #8f3415;
        --docscn-template-accent-fg: #fff7ef;
        --docscn-template-shadow: 0 24px 70px rgba(84, 45, 24, 0.12);
        --gray-150: #f3e9df;
        --gray-200: #eadccd;
        --gray-700: #4f4750;
        --g100: #f3e9df;
        --g200: #eadccd;
        --g700: #4f4750;
        --pre-bg: #f4e9df;
        --code: #f4e9df;
        --code-bg: #f4e9df;
      }

      html {
        background: var(--docscn-template-bg) !important;
        color: var(--docscn-template-ink) !important;
      }

      body {
        background:
          radial-gradient(
            circle at 86% 12%,
            var(--docscn-template-accent-soft),
            transparent 28rem
          ),
          linear-gradient(var(--docscn-template-grid) 1px, transparent 1px),
          linear-gradient(
            90deg,
            var(--docscn-template-grid) 1px,
            transparent 1px
          ),
          var(--docscn-template-bg) !important;
        background-size:
          auto,
          36px 36px,
          36px 36px,
          auto !important;
        color: var(--docscn-template-ink) !important;
      }

      h1,
      h2,
      h3,
      h4,
      .title,
      .headline {
        color: var(--docscn-template-ink) !important;
      }

      .eyebrow,
      .kicker,
      .label,
      .tag,
      .pill,
      .badge,
      .chip,
      .meta,
      .number,
      .index {
        border-color: color-mix(
          in oklab,
          var(--docscn-template-accent) 30%,
          var(--docscn-template-border)
        ) !important;
        color: var(--docscn-template-accent) !important;
      }

      a {
        color: var(--docscn-template-accent) !important;
      }

      article,
      section,
      .card,
      .panel,
      .tile,
      .lane,
      .column,
      .module,
      .node,
      .box,
      .callout,
      .prompt-box,
      .summary,
      .preview,
      .surface,
      .token,
      .variant,
      .report,
      .slide,
      .board,
      .toolbar,
      .component,
      .swatch,
      .flow-node,
      .step {
        border-color: var(--docscn-template-border) !important;
        box-shadow: var(--docscn-template-shadow);
      }

      .card,
      .panel,
      .tile,
      .node,
      .box,
      .callout,
      .prompt-box,
      .summary,
      .preview,
      .surface,
      .lane,
      .slide {
        background: color-mix(
          in oklab,
          var(--docscn-template-surface) 92%,
          transparent
        ) !important;
      }

      pre,
      .code-block,
      .terminal,
      .snippet {
        border-color: color-mix(
          in oklab,
          var(--docscn-template-accent) 18%,
          #101119
        ) !important;
        background: #151620 !important;
        color: #fff7ef !important;
      }

      pre code,
      .code-block code,
      .terminal code,
      .snippet code {
        background: transparent !important;
        color: inherit !important;
      }

      code:not(pre code),
      textarea,
      input,
      select {
        border-color: var(--docscn-template-border) !important;
        background: var(--pre-bg) !important;
        color: var(--docscn-template-ink) !important;
      }

      button,
      .button,
      [role='button'] {
        border-color: color-mix(
          in oklab,
          var(--docscn-template-accent) 42%,
          var(--docscn-template-border)
        ) !important;
        border-radius: var(--docscn-template-radius-sm);
      }

      button:not(.ghost),
      .button:not(.ghost) {
        background: var(--docscn-template-accent) !important;
        color: var(--docscn-template-accent-fg) !important;
      }

      ::selection {
        background: color-mix(
          in oklab,
          var(--docscn-template-accent) 28%,
          transparent
        );
      }
    </style>
  </head>
  <body>
    <main>
      <h1>docscn example artifact</h1>
      <p>
        Publish this file to test the local CLI and artifact viewer. It is a
        self-contained HTML document with inline styles.
      </p>
      <div class="card">
        <strong>Try it</strong>
        <p>
          <code
            >docscn publish examples/artifacts/minimal.html --host
            http://localhost:3000</code
          >
        </p>
      </div>
    </main>
  </body>
</html>
