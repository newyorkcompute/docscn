<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>docscn example artifact</title>
    <style>
      :root {
        color-scheme: light;
        font-family: ui-sans-serif, system-ui, sans-serif;
        --bg: #eef4ff;
        --bg-end: #ffffff;
        --fg: #0f172a;
        --muted: #334155;
        --card: rgba(255, 255, 255, 0.88);
        --border: rgba(15, 23, 42, 0.08);
      }

      @media (prefers-color-scheme: dark) {
        :root:not(.light):not(.dark) {
          color-scheme: dark;
          --bg: #0c1220;
          --bg-end: #111827;
          --fg: #e2e8f0;
          --muted: #94a3b8;
          --card: rgba(17, 24, 39, 0.92);
          --border: rgba(148, 163, 184, 0.18);
        }
      }

      html.dark,
      html[data-docscn-theme='dark'] {
        color-scheme: dark;
        --bg: #0c1220;
        --bg-end: #111827;
        --fg: #e2e8f0;
        --muted: #94a3b8;
        --card: rgba(17, 24, 39, 0.92);
        --border: rgba(148, 163, 184, 0.18);
      }

      html.light,
      html[data-docscn-theme='light'] {
        color-scheme: light;
        --bg: #eef4ff;
        --bg-end: #ffffff;
        --fg: #0f172a;
        --muted: #334155;
        --card: rgba(255, 255, 255, 0.88);
        --border: rgba(15, 23, 42, 0.08);
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(180deg, var(--bg), var(--bg-end));
        color: var(--fg);
      }

      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 4rem 1.5rem;
      }

      h1 {
        font-size: 2.5rem;
        line-height: 1.1;
        margin: 0 0 1rem;
      }

      p {
        font-size: 1.05rem;
        line-height: 1.7;
        color: var(--muted);
      }

      .card {
        margin-top: 2rem;
        padding: 1.25rem 1.5rem;
        border-radius: 1rem;
        background: var(--card);
        border: 1px solid var(--border);
      }

      code {
        font-size: 0.9em;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>docscn example artifact</h1>
      <p>
        Publish this file to test the local CLI and artifact viewer. It is a
        self-contained HTML document with inline styles.
      </p>
      <div class="card">
        <strong>Try it</strong>
        <p>
          <code
            >docscn publish examples/artifacts/minimal.html --host
            http://localhost:3000</code
          >
        </p>
      </div>
    </main>
  </body>
</html>
